<header class="app-navbar">

  <!-- LEFT / BRAND -->
  <div class="navbar-brand">

    <div class="brand-logo">
      <span class="logo-line"></span>
      <span class="logo-line"></span>
      <span class="logo-line"></span>
    </div>

    <div class="brand-info">
      <div class="brand-name">
        ERP
      </div>

      <div class="brand-subtitle">
        Enterprise Resource Planning
      </div>
    </div>

  </div>


  <!-- CENTER -->
  <div class="navbar-center">

    <div class="page-title">

      <div class="title-icon">
        <i class="pi pi-chart-line"></i>
      </div>

      <div>
        <h1>
          {{ languageService.isArabic() ? 'لوحة التحكم' : 'Dashboard' }}
        </h1>

        <span>
          {{
            languageService.isArabic()
              ? 'نظرة عامة على النظام'
              : 'System overview'
          }}
        </span>
      </div>

    </div>

  </div>


  <!-- RIGHT -->
  <div class="navbar-actions">

    <!-- Search -->
    <button
      type="button"
      class="navbar-icon-button"
      aria-label="Search">

      <i class="pi pi-search"></i>

    </button>


    <!-- Notifications -->
    <button
      type="button"
      class="navbar-icon-button notification-button"
      aria-label="Notifications">

      <i class="pi pi-bell"></i>

      <span class="notification-badge">
        3
      </span>

    </button>


    <!-- Language -->
    <div class="language-wrapper">

      <app-combo-box
        [options]="languages"
        optionLabel="name"
        optionValue="code"
        [selectedValue]="languageService.language()"
        (selectedValuesChange)="changeLanguage($event)"
        [showClear]="false"
        styleClass="language-select">
      </app-combo-box>

    </div>


    <!-- User -->
    <div class="user-profile">

      <p-avatar
        label="AC"
        shape="circle"
        styleClass="user-avatar">
      </p-avatar>

      <div class="user-info">

        <span class="user-name">
          Admin
        </span>

        <span class="user-role">
          Administrator
        </span>

      </div>

      <i class="pi pi-chevron-down user-arrow"></i>

    </div>


    <!-- Settings -->
    <button
      type="button"
      class="navbar-icon-button"
      aria-label="Settings">

      <i class="pi pi-cog"></i>

    </button>

  </div>

</header>
